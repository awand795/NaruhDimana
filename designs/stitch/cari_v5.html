<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        const searchContent = document.getElementById('searchContent');
        const scanBtn = document.getElementById('scanBtn');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const closeScannerBtn = document.getElementById('closeScannerBtn');

        // Simple search feedback (would normally filter data)
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length > 2) {
                // Simulate loading state or filtering
                searchContent.style.opacity = '0.5';
                setTimeout(() => {
                    searchContent.style.opacity = '1';
                }, 300);
            }
        });

        // Scanner Overlay Logic
        scanBtn.addEventListener('click', () => {
            scannerOverlay.classList.remove('hidden');
            scannerOverlay.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        });

        closeScannerBtn.addEventListener('click', () => {
            scannerOverlay.classList.add('hidden');
            scannerOverlay.classList.remove('flex');
            document.body.style.overflow = '';
        });
    });
