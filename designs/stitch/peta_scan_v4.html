<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnScan = document.getElementById('btn-scan');
        const btnMap = document.getElementById('btn-map');
        const viewScan = document.getElementById('view-scan');
        const viewMap = document.getElementById('view-map');
        const tabIndicator = document.getElementById('tab-indicator');
        
        let activeTab = 'scan'; // 'scan' or 'map'

        function switchTab(tab) {
            if (activeTab === tab) return;
            activeTab = tab;

            if (tab === 'scan') {
                tabIndicator.style.transform = 'translateX(0)';
                btnScan.classList.replace('text-on-surface-variant', 'text-ocean-indigo');
                btnMap.classList.replace('text-ocean-indigo', 'text-on-surface-variant');
                
                viewMap.classList.remove('opacity-100');
                viewMap.classList.add('opacity-0');
                setTimeout(() => {
                    viewMap.classList.add('hidden');
                    viewMap.classList.remove('flex');
                    viewScan.classList.remove('hidden');
                    viewScan.classList.add('flex');
                    setTimeout(() => {
                        viewScan.classList.remove('opacity-0');
                        viewScan.classList.add('opacity-100');
                    }, 50);
                }, 300);
            } else {
                tabIndicator.style.transform = 'translateX(100%)';
                btnMap.classList.replace('text-on-surface-variant', 'text-ocean-indigo');
                btnScan.classList.replace('text-ocean-indigo', 'text-on-surface-variant');
                
                viewScan.classList.remove('opacity-100');
                viewScan.classList.add('opacity-0');
                setTimeout(() => {
                    viewScan.classList.add('hidden');
                    viewScan.classList.remove('flex');
                    viewMap.classList.remove('hidden');
                    viewMap.classList.add('flex');
                    setTimeout(() => {
                        viewMap.classList.remove('opacity-0');
                        viewMap.classList.add('opacity-100');
                    }, 50);
                }, 300);
            }
        }

        btnScan.addEventListener('click', () => switchTab('scan'));
        btnMap.addEventListener('click', () => switchTab('map'));

        // Scan Line Animation
        const scanLine = document.getElementById('scan-line');
        let pos = 0;
        let direction = 1;
        
        function animateScanLine() {
            if (activeTab === 'scan' && scanLine) {
                pos += direction * 1.5;
                if (pos > 95) direction = -1;
                if (pos < 0) direction = 1;
                scanLine.style.top = `${pos}%`;
            }
            requestAnimationFrame(animateScanLine);
        }
        
        animateScanLine();
    });
</script></main><nav class="fixed floating-dock z-50 glass-effect rounded-full px-4" data-active-classes="text-ocean-indigo"><div class="h-16 flex items-center justify-around"><a class="flex flex-col items-center gap-1 text-outline transition-all active:scale-95" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-md text-label-md">Home</span></a><a class="flex flex-col items-center gap-1 text-outline transition-all active:scale-95" data-path="search" href="#"><span class="material-symbols-outlined text-[24px]">search</span><span class="font-label-md text-label-md">Cari</span></a><a class="w-12 h-12 bg-ocean-indigo text-white rounded-full flex items-center justify-center shadow-lg -translate-y-2 active:scale-90 transition-transform" data-path="add-item" href="#"><span class="material-symbols-outlined text-[28px]">add</span></a><a class="flex flex-col items-center gap-1 text-outline transition-all active:scale-95" data-path="history" href="#"><span class="material-symbols-outlined text-[24px]">history</span><span class="font-label-md text-label-md">Riwayat</span></a><a class="flex flex-col items-center gap-1 text-outline transition-all active:scale-95" data-path="settings" href="#"><span class="material-symbols-outlined text-[24px]">settings</span><span class="font-label-md text-label-md">Opsi</span></a></div></nav></body></html>
