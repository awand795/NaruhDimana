<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#F7F9FC;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.glass-effect{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background-color:rgba(255,255,255,0.8);}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-primary":"#ffffff","surface-bright":"#f9f9ff","surface":"#F7F9FC","secondary-container":"#356ee7","ocean-indigo":"#1A73E8","on-tertiary-container":"#0e0200","on-surface":"#191C1E","surface-tint":"#005bc0","outline":"#727785","surface-container-high":"#e6e8f2","surface-container-lowest":"#ffffff","tertiary-container":"#c55500","on-primary-container":"#ffffff","error":"#ba1a1a","surface-variant":"#e0e2ec","secondary-fixed":"#dae2ff","on-background":"#191c23","inverse-on-surface":"#eff0fa","on-primary-fixed":"#001a41","on-secondary":"#ffffff","on-tertiary":"#ffffff","primary-container":"#1a73e8","on-secondary-fixed":"#001848","on-error-container":"#93000a","on-secondary-fixed-variant":"#0040a2","surface-container":"#ECEEF1","background":"#f9f9ff","on-primary-fixed-variant":"#004493","outline-variant":"#c1c6d6","primary":"#005bbf","inverse-surface":"#2d3038","secondary-fixed-dim":"#b2c5ff","primary-fixed":"#d8e2ff","error-container":"#ffdad6","on-error":"#ffffff","tertiary":"#9e4300","on-surface-variant":"#414754","tertiary-fixed":"#ffdbcb","on-tertiary-fixed":"#341100","on-secondary-container":"#fefcff","tertiary-fixed-dim":"#ffb691","on-tertiary-fixed-variant":"#783100","surface-container-low":"#f2f3fd","surface-dim":"#d8d9e3","surface-container-highest":"#e0e2ec","secondary":"#0453cd","primary-fixed-dim":"#adc7ff","inverse-primary":"#adc7ff"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{gutter:"16px",base:"8px"},fontFamily:{'label-md':['Inter'],'body-md':['Inter'],'headline-sm':['Inter'],'title-lg':['Inter'],'display-lg':['Inter'],'headline-md':['Inter'],'display-lg-mobile':['Inter'],'body-sm':['Inter']},fontSize:{'label-md':['12px',{lineHeight:'16px',fontWeight:'600'}],'body-md':['16px',{lineHeight:'24px',fontWeight:'400'}],'headline-sm':['20px',{lineHeight:'28px',fontWeight:'600'}],'title-lg':['18px',{lineHeight:'24px',fontWeight:'600'}],'display-lg':['32px',{lineHeight:'40px',letterSpacing:'-0.02em',fontWeight:'700'}],'headline-md':['24px',{lineHeight:'32px',letterSpacing:'-0.01em',fontWeight:'700'}],'display-lg-mobile':['28px',{lineHeight:'36px',fontWeight:'700'}],'body-sm':['14px',{lineHeight:'20px',fontWeight:'400'}]}}}}</script><style>

  </head><body class="bg-surface font-body-md text-on-surface flex flex-col"><header class="fixed top-0 inset-x-0 z-50 glass-effect border-b border-surface-container-high pt-safe shadow-sm"><div class="h-16 px-gutter flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center text-ocean-indigo rounded-full active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-title-lg text-title-lg text-on-surface truncate">Tambah Barang</h1></div></header><main class="flex flex-col relative w-full pt-16 bg-surface-container-low min-h-screen"><div class="flex flex-col w-full pb-safe">
<div class="px-gutter pt-6 pb-4">
<div class="w-full aspect-[4/3] bg-surface-container rounded-xl overflow-hidden relative flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-4 shadow-sm text-ocean-indigo">
<span class="material-symbols-outlined text-display-lg">add_a_photo</span>
</div>
<p class="font-title-lg text-title-lg text-on-surface-variant mb-1">Ambil Foto Barang</p>
<p class="font-body-sm text-body-sm text-outline">atau pilih dari galeri</p>
<input accept="image/*" aria-label="Upload foto barang" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" id="image-upload" type="file"/>
</div>
</div>
<div class="px-gutter flex flex-col gap-6 py-4">
<div class="relative group">
<label class="font-label-md text-label-md text-outline mb-2 block transition-colors group-focus-within:text-ocean-indigo" for="nama-barang">Nama Barang</label>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl h-12 px-4 shadow-sm focus:outline-none transition-shadow duration-200" id="nama-barang" placeholder="Contoh: Kamera DSLR Canon" type="text"/>
</div>
<div class="relative group">
<label class="font-label-md text-label-md text-outline mb-2 block transition-colors group-focus-within:text-ocean-indigo" for="lokasi-simpan">Lokasi Simpan</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-xl h-12 px-4 pr-12 shadow-sm focus:outline-none transition-shadow duration-200" id="lokasi-simpan" placeholder="Contoh: Lemari Kaca Laci 2" type="text"/>
<button aria-label="Pilih lokasi terbaru" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-ocean-indigo rounded-full hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined">history</span>
</button>
</div>
</div>
</div>
<div class="px-gutter py-4">
<h3 class="font-title-lg text-title-lg text-on-surface mb-4">Kategori</h3>
<div aria-label="Pilih kategori" class="flex flex-wrap gap-2" id="category-selector" role="radiogroup">
<button aria-checked="true" class="h-10 px-4 rounded-full font-label-md text-label-md transition-all shadow-sm bg-ocean-indigo text-on-primary" data-value="elektronik" role="radio" type="button">
            Elektronik
        </button>
<button aria-checked="false" class="h-10 px-4 rounded-full font-label-md text-label-md transition-all shadow-sm bg-surface-container-lowest text-on-surface hover:bg-surface-container-low" data-value="dokumen" role="radio" type="button">
            Dokumen
        </button>
<button aria-checked="false" class="h-10 px-4 rounded-full font-label-md text-label-md transition-all shadow-sm bg-surface-container-lowest text-on-surface hover:bg-surface-container-low" data-value="pakaian" role="radio" type="button">
            Pakaian
        </button>
<button aria-checked="false" class="h-10 px-4 rounded-full font-label-md text-label-md transition-all shadow-sm bg-surface-container-lowest text-on-surface hover:bg-surface-container-low" data-value="perkakas" role="radio" type="button">
            Perkakas
        </button>
<button aria-checked="false" aria-label="Tambah kategori baru" class="h-10 w-10 flex items-center justify-center rounded-full transition-all shadow-sm bg-surface-container-lowest text-ocean-indigo hover:bg-surface-container-low" role="radio" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<div class="px-gutter py-6 flex flex-col gap-4">
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
</div>
<div>
<p class="font-title-lg text-title-lg text-on-surface">Set Pengingat</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Ingatkan perawatan atau expired</p>
</div>
</div>
<button aria-checked="false" aria-label="Aktifkan pengingat" class="w-12 h-6 bg-surface-container-highest rounded-full relative transition-colors duration-300 ease-in-out focus:outline-none" id="toggle-pengingat" role="switch" type="button">
<div class="w-5 h-5 bg-on-surface-variant rounded-full absolute left-0.5 top-0.5 transition-transform duration-300 ease-in-out transform translate-x-0" id="toggle-pengingat-thumb"></div>
</button>
</div>
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<p class="font-title-lg text-title-lg text-on-surface">Simpan Lokasi GPS</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tandai lokasi presisi saat ini</p>
</div>
</div>
<button aria-checked="true" aria-label="Aktifkan lokasi GPS" class="w-12 h-6 bg-ocean-indigo rounded-full relative transition-colors duration-300 ease-in-out focus:outline-none" id="toggle-gps" role="switch" type="button">
<div class="w-5 h-5 bg-on-primary rounded-full absolute left-0.5 top-0.5 transition-transform duration-300 ease-in-out transform translate-x-6" id="toggle-gps-thumb"></div>
</button>
</div>
</div>
<div class="mt-auto px-gutter py-6">
<button class="w-full h-12 bg-ocean-indigo text-on-primary font-title-lg text-title-lg rounded-xl shadow-md hover:bg-secondary-container active:bg-secondary-container transition-colors flex items-center justify-center gap-2" id="btn-simpan" type="button">
<span class="material-symbols-outlined">save</span>
        Simpan Barang
    </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Category Selector Logic
    const categoryButtons = document.querySelectorAll('#category-selector button[role="radio"]');
    
    categoryButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Reset all
        categoryButtons.forEach(btn => {
            btn.setAttribute('aria-checked', 'false');
            btn.classList.remove('bg-ocean-indigo', 'text-on-primary');
            btn.classList.add('bg-surface-container-lowest', 'text-on-surface');
        });
        
        // Set active
        button.setAttribute('aria-checked', 'true');
        button.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        button.classList.add('bg-ocean-indigo', 'text-on-primary');
      });
    });

    // Toggle Logic Function
    const setupToggle = (buttonId, thumbId) => {
        const button = document.getElementById(buttonId);
        const thumb = document.getElementById(thumbId);
        
        button.addEventListener('click', () => {
            const isChecked = button.getAttribute('aria-checked') === 'true';
            
            if (isChecked) {
                button.setAttribute('aria-checked', 'false');
                button.classList.remove('bg-ocean-indigo');
                button.classList.add('bg-surface-container-highest');
                thumb.classList.remove('translate-x-6', 'bg-on-primary');
                thumb.classList.add('translate-x-0', 'bg-on-surface-variant');
            } else {
                button.setAttribute('aria-checked', 'true');
                button.classList.remove('bg-surface-container-highest');
                button.classList.add('bg-ocean-indigo');
                thumb.classList.remove('translate-x-0', 'bg-on-surface-variant');
                thumb.classList.add('translate-x-6', 'bg-on-primary');
            }
        });
    };

    setupToggle('toggle-pengingat', 'toggle-pengingat-thumb');
    setupToggle('toggle-gps', 'toggle-gps-thumb');

    // Focus state for inputs using CSS group-focus-within handled in HTML classes
    
    // Simulate Image Upload Feedback
    const imageUpload = document.getElementById('image-upload');
    imageUpload.addEventListener('change', (e) => {
        if(e.target.files && e.target.files.length > 0) {
            const container = e.target.parentElement;
            container.innerHTML = `
                <div class="absolute inset-0 bg-ocean-indigo/10 flex items-center justify-center">
                    <span class="material-symbols-outlined text-display-lg text-ocean-indigo animate-pulse">check_circle</span>
                </div>
                <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" id="image-upload" aria-label="Upload foto barang">
            `;
            // Reattach listener to new input
            document.getElementById('image-upload').addEventListener('change', arguments.callee);
        }
    });

    // Save Button Effect
    const btnSimpan = document.getElementById('btn-simpan');
    btnSimpan.addEventListener('click', function() {
        this.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Menyimpan...';
        this.classList.add('opacity-90');
        setTimeout(() => {
            this.innerHTML = '<span class="material-symbols-outlined">check</span> Tersimpan';
            this.classList.remove('bg-ocean-indigo');
            this.classList.add('bg-secondary');
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">save</span> Simpan Barang';
                this.classList.remove('bg-secondary');
                this.classList.add('bg-ocean-indigo');
                this.classList.remove('opacity-90');
            }, 2000);
        }, 1500);
    });
  });
</script></main></body></html>
